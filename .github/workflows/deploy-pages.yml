name: Deploy interactive debate showcase

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - name: Check static entry, autoplay, geometry, navigation and network isolation
        run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-browser-results
          path: test-artifacts/pages/*results.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (Settings → Pages → Source must be GitHub Actions)
        uses: actions/configure-pages@v5
      - name: Deploy static showcase
        id: deployment
        uses: actions/deploy-pages@v4
